
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - env | grep -e '^NEXTAUTH_SECRET=' -e '^NEXTAUTH_URL=' -e '^GOOGLE_CLIENT_ID=' -e '^GOOGLE_CLIENT_SECRET=' -e '^AWS_AUTH_API_URL=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
